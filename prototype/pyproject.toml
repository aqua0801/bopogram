[project]
name = "bopogram"
version = "0.0.0"
description = "Bopogram prototype engine: context-aware bopomofo input (Python)"
requires-python = ">=3.12"
dependencies = [
    "kenlm>=0.3.0",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
]

[project.scripts]
bopogram = "bopogram.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
