[project]
name = "bopogram-training"
version = "0.0.0"
description = "Corpus collection, cleaning and model training scripts for Bopogram"
requires-python = ">=3.12"
dependencies = [
    "mwparserfromhell>=0.6.6",
    "numpy>=2.5.4",
    "opencc>=1.1.9",
    "openpyxl>=3.1.5",
    "pyarrow>=26.0.1",
    "torch>=2.6.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"
