# cargo-about: the licence texts of every Rust crate in the programs, for the
# installers (THIRD-PARTY-LICENSES.html). Same platforms and licences as
# deny.toml.
#   cargo about generate --workspace --offline --fail about.hbs -o THIRD-PARTY-LICENSES.html
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
    "BSD-3-Clause",
    "Zlib",
]
targets = ["x86_64-pc-windows-msvc", "i686-pc-windows-msvc", "x86_64-unknown-linux-musl"]
ignore-dev-dependencies = true
# Run with --offline: licence texts come from the crates themselves.
