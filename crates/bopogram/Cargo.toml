[package]
name = "bopogram"
description = "Bopogram engine: context-aware bopomofo conversion (no Windows components)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bopogram"
path = "src/lib.rs"

[[bin]]
name = "bopogram"
path = "src/main.rs"

[dependencies]
calamine = "0.38"
# float_roundtrip: numbers read exactly as Python reads them (config weights,
# test vectors); the default parser can be one unit in the last place off.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "0.11"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
