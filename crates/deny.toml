# cargo-deny: the licenses of everything the crates pull in.
#   cargo deny check licenses     fails on any license not allowed below
#   cargo deny list -l crate      every crate with its license
# Only the platforms we build for are counted.

[graph]
targets = ["x86_64-pc-windows-msvc", "i686-pc-windows-msvc", "x86_64-unknown-linux-musl"]

[licenses]
# Permissive licenses only. Where a crate offers a choice ("MIT OR
# Apache-2.0 OR LGPL-2.1-or-later"), one allowed option is enough.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
    # Brought in by calamine and zip (2026-11-27): encoding_rs (BSD-3-Clause
    # for its WHATWG data) and zlib-rs (Zlib).
    "BSD-3-Clause",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = false
