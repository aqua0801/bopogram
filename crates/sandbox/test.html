<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>Bopogram test page</title>
<style>
  body { font: 16px "Microsoft JhengHei UI", sans-serif; max-width: 40em; margin: 2em auto; }
  label { display: block; margin-top: 1.5em; }
  input, textarea { font: inherit; width: 100%; box-sizing: border-box; padding: .4em; }
</style>
<h1>Bopogram 測試頁</h1>
<label>單行輸入框
  <input type="text" autofocus>
</label>
<label>多行輸入框（測試上文：先打一句送出，再接著打）
  <textarea rows="5"></textarea>
</label>
<label>密碼欄位（輸入法應該完全不作用，按鍵直接變成英數字）
  <input type="password">
</label>
<label>聊天框（模擬 Discord／LINE：Enter 送出、Shift+Enter 換行。多行片語插入後不應該被送出）
  <div id="chat" contenteditable="true" style="border: 1px solid #888; min-height: 4em; padding: .4em; white-space: pre-wrap"></div>
</label>
<ol id="sent"></ol>
<label>事件記錄（最近 60 筆，最新在上；只記錄這一頁收到的事件）
  <button type="button" id="clear">清除</button>
</label>
<pre id="log" style="font: 13px Consolas, monospace; background: #f4f4f4; padding: .4em; max-height: 24em; overflow: auto"></pre>
<script>
  const log = document.getElementById("log");
  const lines = [];
  const note = (text) => {
    lines.unshift(new Date().toISOString().slice(17, 23) + " " + text);
    lines.length = Math.min(lines.length, 60);
    log.textContent = lines.join("\n");
  };
  document.getElementById("clear").addEventListener("click", () => { lines.length = 0; log.textContent = ""; });
  for (const type of ["keydown", "keyup"]) {
    document.addEventListener(type, (e) => note(
      `${type} key=${JSON.stringify(e.key)} code=${e.code || "-"} shift=${e.shiftKey} composing=${e.isComposing} target=${e.target.id || e.target.tagName}`), true);
  }
  document.addEventListener("beforeinput", (e) => note(
    `beforeinput ${e.inputType} data=${JSON.stringify(e.data)} composing=${e.isComposing}`), true);
  for (const type of ["compositionstart", "compositionend"]) {
    document.addEventListener(type, (e) => note(`${type} data=${JSON.stringify(e.data)}`), true);
  }
</script>
<script>
  const chat = document.getElementById("chat");
  chat.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      const item = document.createElement("li");
      item.textContent = "送出：" + JSON.stringify(chat.innerText);
      document.getElementById("sent").appendChild(item);
      chat.textContent = "";
    }
  });
</script>
</html>
