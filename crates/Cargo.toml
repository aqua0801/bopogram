[workspace]
resolver = "2"
members = ["bopogram-host", "bopogram-ime", "bopogram-settings"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde_json = "1"
windows = "0.62"
windows-core = "0.62"

# No `panic = "abort"`: the IME DLL lives inside other people's processes and
# catches panics at its entry points rather than taking the application down.
